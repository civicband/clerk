name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
        sqlalchemy-version: ["2.1.*"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clerk
          POSTGRES_PASSWORD: clerk
          POSTGRES_DB: clerk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clerk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://clerk:clerk@localhost:5432/clerk_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Pin SQLAlchemy ${{ matrix.sqlalchemy-version }}
        run: |
          uv pip install --system "sqlalchemy==${{ matrix.sqlalchemy-version }}"

      - name: Verify psycopg3 PostgreSQL dialect
        run: |
          python -c "
          from sqlalchemy import create_engine, text
          e = create_engine('postgresql+psycopg://clerk:clerk@localhost:5432/clerk_test')
          assert e.dialect.driver == 'psycopg', e.dialect.driver
          with e.connect() as c:
              c.execute(text('SELECT 1'))
          print('psycopg3 OK')
          "

      - name: Run tests
        run: |
          pytest tests/ -v --cov --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
