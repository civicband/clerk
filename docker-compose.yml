x-common-settings: &common-settings
  build: .
  env_file: .env
  restart: on-failure
  environment:
    - STORAGE_DIR=/clerk_sites
    - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://victoria-traces:10428/insert/opentelemetry/v1/traces}
    - OTEL_SERVICE_NAME=clerk
    - METRICS_PORT=0
    - PROMETHEUS_MULTIPROC_DIR=/prom
  volumes:
    - ${STORAGE_DIR}:/clerk_sites/
    - .:/app
    - prom-multiproc:/prom
  networks:
    - clerk

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - 6379:6379
    networks:
      - clerk

  fetch_worker:
    <<: *common-settings
    container_name: clerk-fetch
    command: clerk worker fetch -n ${FETCH_WORKERS}
    pid: "host"

  ocr_worker:
    <<: *common-settings
    container_name: clerk-ocr
    command: clerk worker ocr -n ${OCR_WORKERS}
    pid: "host"

  compilation_worker:
    <<: *common-settings
    container_name: clerk-compilation
    command: clerk worker compilation -n ${COMPILATION_WORKERS}
    pid: "host"

  deploy_worker:
    <<: *common-settings
    container_name: clerk-deploy
    command: clerk worker deploy -n ${DEPLOY_WORKERS}
    pid: "host"

  metrics:
    <<: *common-settings
    container_name: clerk-metrics
    command: clerk metrics-exporter
    pid: "host"
    environment:
      - STORAGE_DIR=/clerk_sites
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://victoria-traces:10428/insert/opentelemetry/v1/traces}
      - OTEL_SERVICE_NAME=clerk
      - METRICS_PORT=9800
      - PROMETHEUS_MULTIPROC_DIR=/prom
    ports:
      - "9800:9800"

  vector:
    image: timberio/vector:0.46.0-distroless-libc # check for newer tag
    container_name: vector
    restart: unless-stopped
    env_file: .env
    environment:
      - VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION=true
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - ./deployment/vector/vector.toml:/etc/vector/vector.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # don't collect vector's own logs into a loop
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

networks:
  clerk:

volumes:
  prom-multiproc:
